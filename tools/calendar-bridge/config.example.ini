; Copy to config.ini (git-ignored) and edit.
[esp32]
; mDNS name of the board (MDNS_HOSTNAME in config.h) or its IP address. The board
; only has WiFi on for ~2 min every 15, and mDNS can be slow to answer right after
; it connects: a fixed IP (DHCP reservation in the router) is more reliable.
host = rlcd-dashboard.local
port = 80
; Must match CALENDAR_TOKEN in secrets.h
token = change-me
; The board's WiFi window (:59-:01, :14-:16, ...) is short: retry every few seconds
; until it answers. timeout_s is per attempt.
retry_every_s = 5
timeout_s = 4
; Only used when running resident (without --once; the scheduled task uses --once):
; start reading Outlook this many seconds before each window opens
read_lead_s = 40

[outlook]
; new = new Outlook for Windows (its offline cache), classic = classic Outlook (COM)
source = new
; Only this account's meetings, if the new Outlook has several (e.g. work + personal).
; Leave empty to use all of them.
mailbox =
; New Outlook data folder; empty = %LOCALAPPDATA%\Microsoft\Olk\EBWebView\Default\IndexedDB
indexeddb_dir =
