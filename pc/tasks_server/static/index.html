<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tasks</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f4f'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #eef0ea; --surface: #ffffff; --ink: #1c211f; --muted: #66706b; --line: #dde1d9;
    --accent: #2f6f4f; --accent-soft: #e1efe6; --accent-ink: #ffffff;
    --high: #b4690e; --high-soft: #fbeedc;
    --danger: #b3261e; --danger-soft: #fbe5e3;
    --warn: #8a5a00; --warn-soft: #fbf0d3;
    --shadow: 0 1px 2px rgba(20, 30, 25, .06), 0 4px 14px rgba(20, 30, 25, .05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121514; --surface: #1c2120; --ink: #e8ece9; --muted: #94a09a; --line: #2d3532;
      --accent: #6fbf94; --accent-soft: #1f3329; --accent-ink: #0e1d15;
      --high: #f0b45f; --high-soft: #3a2d17;
      --danger: #f2877f; --danger-soft: #3b1f1d;
      --warn: #e3b25c; --warn-soft: #382e15;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 96px; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- header ---------- */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 1.75rem; letter-spacing: -.02em; line-height: 1.1; }
  .count { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .sync { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; font-size: .82rem;
          background: var(--surface); border: 1px solid var(--line); color: var(--muted); max-width: 100%; }
  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 100%; }
  .tool { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; font-size: .82rem;
          background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .tool:hover { color: var(--ink); border-color: var(--muted); }
  .tool svg { width: 16px; height: 16px; }
  .sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .sync.ok .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .sync.pending { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .sync.pending .dot { background: var(--warn); }
  .sync.error { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
  .sync.error .dot { background: var(--danger); }

  /* ---------- composer ---------- */
  .composer { display: flex; gap: 6px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
              box-shadow: var(--shadow); padding: 8px 8px 8px 12px; margin-bottom: 20px; }
  .composer input[type=text] { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 4px; font-size: 1.05rem; }
  .composer input[type=text]:focus-visible { outline: none; }
  .composer input[type=text]::placeholder { color: var(--muted); }
  .add { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; }
  .add:disabled { opacity: .45; cursor: default; }

  /* ---------- list ---------- */
  ul { list-style: none; margin: 0; padding: 0; }
  .task { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
          padding: 8px 8px 8px 12px; margin-bottom: 8px; box-shadow: var(--shadow); transition: opacity .2s, transform .2s cubic-bezier(.2, .8, .2, 1); }
  .task.leaving { opacity: 0; transform: translateX(12px); }
  .task.high { border-left: 4px solid var(--high); padding-left: 9px; }
  .check { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); flex: none; margin: 0; display: grid; place-items: center; cursor: pointer; background: transparent; }
  .check:hover { border-color: var(--accent); }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .text { flex: 1; min-width: 0; background: none; border: 0; padding: 6px 0; text-align: left; overflow-wrap: anywhere; cursor: pointer; display: block; }
  .text .meta { display: block; font-size: .8rem; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .done .text .title { text-decoration: line-through; color: var(--muted); }
  .icon-btn { border: 0; background: transparent; color: var(--muted); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; flex: none; }
  .icon-btn:hover { background: var(--bg); color: var(--ink); }
  .icon-btn[aria-pressed=true] { color: var(--high); background: var(--high-soft); }
  .icon-btn[aria-pressed=true] svg { fill: currentColor; }
  .icon-btn.trash:hover { color: var(--danger); }
  .grip { cursor: grab; touch-action: none; width: 28px; margin-left: -6px; }
  .task.dragging { box-shadow: 0 10px 28px rgba(0, 0, 0, .25); border-color: var(--accent); position: relative; z-index: 2;
                   transition: box-shadow .15s; will-change: transform; }
  .task.dragging.dropping { transition: transform .18s cubic-bezier(.2, .8, .2, 1), box-shadow .18s; box-shadow: var(--shadow); }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
  .limit { margin: 16px 4px 10px; font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .limit::before, .limit::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
  .empty-state { text-align: center; color: var(--muted); padding: 36px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }
  .empty-state strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }

  /* ---------- done ---------- */
  details { margin-top: 24px; }
  summary { cursor: pointer; color: var(--muted); font-size: .92rem; padding: 6px 4px; display: flex; align-items: center; gap: 8px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; font-size: .8em; transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  summary .clear { margin-left: auto; font-size: .82rem; color: var(--muted); background: none; border: 0; text-decoration: underline; padding: 2px 6px; }
  summary .clear:hover { color: var(--danger); }
  details ul { margin-top: 8px; }

  /* ---------- dialogs ---------- */
  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); box-shadow: 0 16px 48px rgba(0, 0, 0, .35);
           padding: 0; width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
  dialog::backdrop { background: rgba(10, 14, 12, .5); }
  .dlg { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .dlg h2 { margin: 0; font-size: 1.15rem; }
  .dlg p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); }
  .field input, .field textarea { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--bg); color: var(--ink); font-size: 1rem; width: 100%; }
  .field textarea { min-height: 120px; resize: vertical; }
  .prio { display: flex; align-items: center; gap: 8px; font-size: .95rem; }
  .info { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: .85rem; padding: 10px 12px; background: var(--bg); border-radius: 10px; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .actions .spacer { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 600; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn.danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
  /* Import: one button per choice */
  .choices { display: grid; gap: 8px; }
  .choice { text-align: left; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; }
  .choice:hover { border-color: var(--accent); }
  .choice strong { display: block; }
  .choice span { color: var(--muted); font-size: .85rem; }
  .cancel { align-self: flex-start; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px; }

  /* ---------- toast ---------- */
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 24px); opacity: 0; pointer-events: none; transition: .2s;
           background: var(--ink); color: var(--bg); padding: 10px 14px 10px 16px; border-radius: 12px; display: flex; gap: 14px; align-items: center;
           box-shadow: 0 8px 24px rgba(0, 0, 0, .25); max-width: calc(100vw - 32px); z-index: 10; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 2px 4px; }
  @media (prefers-color-scheme: light) { #toast button { color: #8fd6ae; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 0h11l-2 4 2 4H5"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5m0 0L8 9m4-4l4 4M5 20h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
</svg>

<main>
  <header>
    <div>
      <h1>Tasks</h1>
      <div class="count" id="count"></div>
    </div>
    <div class="tools">
      <button type="button" class="tool" id="export" title="Download every task as a JSON file"><svg><use href="#i-download"/></svg>Export</button>
      <button type="button" class="tool" id="import" title="Load tasks from an exported file (or a tasks.json)"><svg><use href="#i-upload"/></svg>Import</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <div class="sync" id="sync" role="status"><span class="dot"></span><span id="sync-text">Loading…</span></div>
    </div>
  </header>

  <form class="composer" id="composer" autocomplete="off">
    <label class="sr-only" for="new-text">New task</label>
    <input type="text" id="new-text" placeholder="Add a task…" maxlength="200" enterkeyhint="done">
    <button type="button" class="icon-btn" id="new-high" aria-pressed="false" title="High priority" aria-label="High priority"><svg><use href="#i-flag"/></svg></button>
    <button class="add" id="add" type="submit" disabled>Add</button>
  </form>

  <ul id="pending"></ul>

  <details id="done-box" hidden>
    <summary><span id="done-title">Done</span><button type="button" class="clear" id="clear-done">Clear all</button></summary>
    <ul id="done"></ul>
  </details>
</main>

<dialog id="detail" aria-labelledby="detail-heading">
  <form class="dlg" id="detail-form" autocomplete="off">
    <h2 id="detail-heading">Task</h2>
    <label class="field">Title<input type="text" id="d-text" maxlength="200" required></label>
    <label class="field">Description<textarea id="d-desc" maxlength="2000" placeholder="Add more details…"></textarea></label>
    <label class="prio"><input type="checkbox" id="d-high"> High priority</label>
    <dl class="info" id="d-info"></dl>
    <div class="actions">
      <button type="button" class="btn danger" id="d-delete">Delete</button>
      <button type="button" class="btn" id="d-toggle"></button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="d-close">Close</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <form class="dlg" method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="actions">
      <button type="submit" class="btn" value="cancel" id="confirm-cancel">Cancel</button>
      <button type="submit" class="btn primary" value="ok" id="confirm-ok"></button>
    </div>
  </form>
</dialog>

<dialog id="import-dialog" aria-labelledby="import-title">
  <form class="dlg" method="dialog">
    <h2 id="import-title">Import tasks</h2>
    <p id="import-summary"></p>
    <div class="choices">
      <button class="choice" value="merge"><strong>Merge</strong><span>Add them after the current tasks, skipping the ones already there</span></button>
      <button class="choice" value="replace"><strong>Replace</strong><span>The imported list replaces the current one (a backup is kept and you can undo)</span></button>
    </div>
    <button class="cancel" value="cancel">Cancel</button>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-undo">Undo</button></div>

<script>
// Tasks the board can show (TASKS_MAX_ITEMS in config.h); the ones below the line wait for a free slot
const BOARD_SLOTS = 20;
const TOKEN_KEY = "tasks-web-token";
const REFRESH_MS = 15000;

const $ = (id) => document.getElementById(id);
const state = { tasks: [], updatedAt: 0, revision: 0, board: null, high: false, dragging: false };

// ---------- helpers ----------
function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}
function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#i-" + name);
  svg.append(use);
  return svg;
}
const clock = (epoch) => new Date(epoch * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
function fullDate(epoch) {
  if (!epoch) return "Unknown";
  return new Date(epoch * 1000).toLocaleString([], { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function inMinutes(epoch) {
  const min = Math.max(0, Math.round((epoch * 1000 - Date.now()) / 60000));
  return min <= 0 ? "now" : min === 1 ? "in 1 min" : `in ${min} min`;
}

// ---------- API ----------
// The token is kept in memory too, so a browser that blocks storage asks only once
let webToken = null;
function savedToken() {
  if (webToken !== null) return webToken;
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
}
let askingToken = null;  // One prompt at a time, shared by the requests that got a 401
function askToken() {
  askingToken ??= Promise.resolve().then(() => {
    const entered = prompt("Access token for this page:");
    askingToken = null;
    if (entered === null) throw new Error("Access token needed");
    webToken = entered;
    try { localStorage.setItem(TOKEN_KEY, entered); } catch { /* kept in memory */ }
  });
  return askingToken;
}

async function api(method, path, body, retried = false) {
  const headers = { "X-Web-Token": savedToken() };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  let response;
  try {
    response = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  } catch {
    throw new Error("The task server is not reachable");
  }
  if (response.status === 401) {
    if (retried) throw new Error("Wrong access token");
    await askToken();
    return api(method, path, body, true);
  }
  let data;
  try { data = await response.json(); } catch { data = {}; }
  if (!response.ok) throw new Error(data.error || `${response.status} ${response.statusText}`);
  return data;
}

async function load() {
  const data = await api("GET", "/api/tasks");
  data.tasks.forEach((t) => { t.description ??= ""; });  // Older servers don't send it
  Object.assign(state, { tasks: data.tasks, updatedAt: data.updated_at, revision: data.revision, board: data.board });
  render();
}

// Runs a change, then refreshes; a failure shows in the toast and the list is reloaded as it really is
async function act(change) {
  try {
    await change();
  } catch (error) {
    toast(error.message);
  }
  await load().catch((error) => toast(error.message));
}

// ---------- toast with undo ----------
let toastTimer = 0, undoAction = null;
function toast(message, undo = null) {
  $("toast-text").textContent = message;
  $("toast-undo").hidden = !undo;
  undoAction = undo;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), undo ? 6000 : 3500);
}
$("toast-undo").addEventListener("click", () => {
  const undo = undoAction;
  undoAction = null;
  $("toast").classList.remove("show");
  if (undo) act(undo);
});

// ---------- confirmation ----------
function confirmDialog(title, message, okLabel, danger = false) {
  $("confirm-title").textContent = title;
  $("confirm-text").textContent = message;
  const ok = $("confirm-ok");
  ok.textContent = okLabel;
  ok.className = "btn primary" + (danger ? " danger solid" : "");
  const dialog = $("confirm");
  return new Promise((resolve) => {
    dialog.addEventListener("close", () => resolve(dialog.returnValue === "ok"), { once: true });
    dialog.returnValue = "cancel";
    dialog.showModal();
    $("confirm-cancel").focus();
  });
}

// The changes that ask first; each returns whether it went ahead
async function setDone(task, done) {
  const ok = await confirmDialog(done ? "Mark as done?" : "Remove from done?", `"${task.text}"`, done ? "Mark as done" : "Move to pending");
  if (!ok) return false;
  await act(() => api("PATCH", `/api/tasks/${task.id}`, { done }));
  if (done) toast(`Done: ${task.text}`, () => api("PATCH", `/api/tasks/${task.id}`, { done: false }));
  return true;
}

async function deleteTask(task) {
  const ok = await confirmDialog("Delete this task?", `"${task.text}" will be removed for good.`, "Delete", true);
  if (!ok) return false;
  let deleted = null;
  await act(async () => { deleted = await api("DELETE", `/api/tasks/${task.id}`); });
  // Undo puts it back where it was, with its state, description and creation time
  if (deleted) toast(`Deleted: ${task.text}`, () => api("POST", "/api/tasks", {
    text: deleted.text, high: deleted.high, done: deleted.done, created: deleted.created,
    description: deleted.description ?? "", position: deleted.position }));
  return true;
}

// ---------- details ----------
let detailId = null;

function openDetail(id) {
  const task = state.tasks.find((t) => t.id === id);
  if (!task) return;
  detailId = id;
  $("detail-heading").textContent = task.done ? "Done task" : "Task";
  $("d-text").value = task.text;
  $("d-desc").value = task.description;
  $("d-high").checked = task.high;
  $("d-toggle").textContent = task.done ? "Move to pending" : "Mark as done";

  const pending = state.tasks.filter((t) => !t.done);
  const place = task.done ? "No (done)"
    : pending.indexOf(task) < BOARD_SLOTS ? `Yes · position ${pending.indexOf(task) + 1}`
    : "Waiting for a free slot";
  const rows = [["Status", task.done ? "Done" : "Pending"], ["Created", fullDate(task.created)]];
  if (task.done) rows.push(["Done on", fullDate(task.done_at)]);
  rows.push(["On the board", place], ["Task id", `#${task.id}`]);
  $("d-info").replaceChildren(...rows.flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v)]));

  $("detail").showModal();
  $("d-text").blur();  // Don't open the keyboard on phones; the person taps what to edit
}

$("detail-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const task = state.tasks.find((t) => t.id === detailId);
  const text = $("d-text").value.trim();
  if (!task || !text) return;
  const changes = {};
  if (text !== task.text) changes.text = text;
  if ($("d-desc").value.trim() !== task.description) changes.description = $("d-desc").value;
  if ($("d-high").checked !== task.high) changes.high = $("d-high").checked;
  $("detail").close();
  if (Object.keys(changes).length) act(() => api("PATCH", `/api/tasks/${task.id}`, changes));
});
$("d-close").addEventListener("click", () => $("detail").close());
// A click on the backdrop (the dialog element itself, not its form) closes it
$("detail").addEventListener("click", (event) => { if (event.target === $("detail")) $("detail").close(); });
$("d-toggle").addEventListener("click", async () => {
  const task = state.tasks.find((t) => t.id === detailId);
  if (task && await setDone(task, !task.done)) $("detail").close();
});
$("d-delete").addEventListener("click", async () => {
  const task = state.tasks.find((t) => t.id === detailId);
  if (task && await deleteTask(task)) $("detail").close();
});

// ---------- rendering ----------
function row(task) {
  const check = el("input", { type: "checkbox", className: "check", checked: task.done,
                              ariaLabel: task.done ? `Mark "${task.text}" as pending` : `Mark "${task.text}" as done` });
  check.addEventListener("change", () => {
    check.checked = task.done;  // Stays as it is until the change is confirmed
    setDone(task, !task.done);
  });

  const text = el("button", { type: "button", className: "text", title: "Click for details" }, el("span", { className: "title" }, task.text));
  // Second line: when it was done, or the start of the description
  const meta = task.done ? (task.done_at ? `Done on ${fullDate(task.done_at)}` : "") : task.description.split("\n")[0];
  if (meta) text.append(el("span", { className: "meta" }, meta));
  text.addEventListener("click", () => openDetail(task.id));

  const flag = el("button", { type: "button", className: "icon-btn flag", ariaPressed: String(task.high),
                              title: task.high ? "High priority" : "Mark as high priority", ariaLabel: "High priority" }, icon("flag"));
  flag.addEventListener("click", () => act(() => api("PATCH", `/api/tasks/${task.id}`, { high: !task.high })));

  const trash = el("button", { type: "button", className: "icon-btn trash", title: "Delete", ariaLabel: `Delete "${task.text}"` }, icon("trash"));
  trash.addEventListener("click", () => deleteTask(task));

  const li = el("li", { className: "task" + (task.done ? " done" : "") + (task.high && !task.done ? " high" : "") },
    check, text, ...(task.done ? [] : [flag]), trash);
  if (!task.done) {
    li.dataset.id = task.id;
    li.prepend(grip(li, task));
  }
  return li;
}

// ---------- reordering ----------
// The order of the list is the order on the board. The handle works with the mouse, a
// finger (pointer events) and the keyboard (arrow keys while it is focused).
function pendingIds() {
  return [...$("pending").querySelectorAll("li.task")].map((li) => Number(li.dataset.id));
}
const saveOrder = () => act(() => api("POST", "/api/tasks/order", { ids: pendingIds() }));

function grip(li, task) {
  const handle = el("button", { type: "button", className: "icon-btn grip", title: "Drag to reorder",
                                ariaLabel: `Reorder "${task.text}" (arrow keys move it)` }, icon("grip"));

  // The rows are not moved in the DOM while dragging (that would drop the pointer
  // capture): the dragged one follows the pointer with a transform, the ones it
  // passes slide out of the way, and the order is committed when it is dropped.
  handle.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    event.preventDefault();
    handle.setPointerCapture(event.pointerId);

    const rows = [...$("pending").querySelectorAll("li.task")];
    const from = rows.indexOf(li);
    const box = (row) => { const r = row.getBoundingClientRect(); return { top: r.top + scrollY, bottom: r.bottom + scrollY, h: r.height }; };
    const slots = rows.map(box);  // Where every row starts, in page coordinates
    const gap = slots.length > 1 ? slots[1].top - slots[0].bottom : 8;
    const lift = slots[from].h + gap;
    const startY = event.clientY + scrollY;
    const minOffset = slots[0].top - slots[from].top;
    const maxOffset = slots[slots.length - 1].bottom - slots[from].bottom;
    let clientY = event.clientY, to = from, scroller = 0;

    state.dragging = true;
    li.classList.add("dragging");
    document.body.classList.add("dragging");

    const offset = () => Math.min(Math.max(clientY + scrollY - startY, minOffset), maxOffset);
    const update = () => {
      const dy = offset();
      li.style.transform = `translateY(${dy}px) scale(1.02)`;
      // The slot is the one whose middle the dragged row's middle has passed
      const middle = slots[from].top + slots[from].h / 2 + dy;
      to = 0;
      slots.forEach((slot, i) => { if (i !== from && middle > slot.top + slot.h / 2) to = i + (i < from ? 1 : 0); });
      rows.forEach((row, i) => {
        if (i === from) return;
        const shift = i > from && i <= to ? -lift : i < from && i >= to ? lift : 0;
        row.style.transform = shift ? `translateY(${shift}px)` : "";
      });
    };
    // Near the top or bottom edge of the window the page scrolls by itself
    const autoScroll = () => {
      const edge = 70, speed = clientY < edge ? -(edge - clientY) / 5 : clientY > innerHeight - edge ? (clientY - innerHeight + edge) / 5 : 0;
      if (speed) { scrollBy(0, speed); update(); }
      scroller = requestAnimationFrame(autoScroll);
    };
    scroller = requestAnimationFrame(autoScroll);

    const move = (e) => { clientY = e.clientY; update(); };
    const finish = (commit) => {
      cancelAnimationFrame(scroller);
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      handle.removeEventListener("pointercancel", cancel);
      document.removeEventListener("keydown", key);
      if (!commit) to = from;

      // Settle into the slot, then make it the real order
      const settle = to > from ? slots[to].bottom - slots[from].bottom : slots[to].top - slots[from].top;
      li.classList.add("dropping");
      li.style.transform = `translateY(${settle}px)`;
      rows.forEach((row, i) => { if (i !== from) row.style.transform = i > from && i <= to ? `translateY(${-lift}px)` : i < from && i >= to ? `translateY(${lift}px)` : ""; });
      setTimeout(() => {
        const list = $("pending");
        rows.forEach((row) => { row.style.transition = "none"; row.style.transform = ""; });
        if (to !== from) (to > from ? rows[to].after(li) : rows[to].before(li));
        li.classList.remove("dragging", "dropping");
        document.body.classList.remove("dragging");
        void list.offsetHeight;  // Apply the reset before transitions come back
        rows.forEach((row) => { row.style.transition = ""; });
        state.dragging = false;
        if (to !== from) saveOrder(); else render();
      }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 180);
    };
    const up = () => finish(true);
    const cancel = () => finish(false);
    const key = (e) => { if (e.key === "Escape") finish(false); };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", cancel);
    document.addEventListener("keydown", key);
  });

  handle.addEventListener("keydown", (event) => {
    const up = event.key === "ArrowUp", down = event.key === "ArrowDown";
    if (!up && !down) return;
    event.preventDefault();
    const other = up ? li.previousElementSibling : li.nextElementSibling;
    if (!other?.classList.contains("task")) return;
    if (up) other.before(li); else other.after(li);
    state.refocus = task.id;  // The reload after saving rebuilds the rows: put the focus back
    saveOrder();
  });
  return handle;
}

function render() {
  if (state.dragging) return;  // A reload must not drop the task being dragged

  const pending = state.tasks.filter((t) => !t.done);  // Already in display order
  const done = state.tasks.filter((t) => t.done).sort((a, b) => b.done_at - a.done_at);

  $("count").textContent = pending.length === 0 ? "All clear" : `${pending.length} pending`;

  const list = $("pending");
  list.replaceChildren();
  if (pending.length === 0) {
    list.append(el("li", { className: "empty-state" }, el("strong", {}, "Nothing pending"), "Add a task above and it will show up on the board."));
  }
  pending.forEach((task, i) => {
    if (i === BOARD_SLOTS) list.append(el("li", { className: "limit" }, `The board shows ${BOARD_SLOTS}; the rest wait for a free slot`));
    list.append(row(task));
  });

  $("done-box").hidden = done.length === 0;
  $("done-title").textContent = `Done (${done.length})`;
  $("done").replaceChildren(...done.map(row));
  if (state.refocus) {
    $("pending").querySelector(`li[data-id="${state.refocus}"] .grip`)?.focus();
    state.refocus = null;
  }
  renderSync();
}

function renderSync() {
  const box = $("sync"), text = $("sync-text"), board = state.board;
  if (!board) return;
  // The board holds exactly the revision it was last given (delivered_rev): no clocks compared
  const onBoard = board.delivered_rev === state.revision;
  const next = board.next_window ? `${inMinutes(board.next_window)} (${clock(board.next_window)})` : "";
  let cls = "", message;
  if (!board.enabled) {
    message = "Page only · not syncing with the board";
  } else if (board.error) {
    cls = " error";
    message = `${board.error}${onBoard ? " · it has the latest tasks" : ""}${next ? ` · next try ${next}` : ""}`;
  } else if (onBoard) {
    cls = " ok";
    message = `On the board · synced ${clock(board.delivered_at)}`;
  } else if (board.always_on) {
    cls = " pending";
    message = "Sending to the board…";
  } else if (board.delivered_rev) {
    cls = " pending";
    message = `Changes reach the board ${next}`;
  } else {
    cls = state.tasks.length ? " pending" : "";
    message = next ? `Not on the board yet · next sync ${next}` : "Waiting for the board";
  }
  box.className = "sync" + cls;
  text.textContent = message;
}

// ---------- composer ----------
$("new-high").addEventListener("click", () => {
  state.high = !state.high;
  $("new-high").setAttribute("aria-pressed", String(state.high));
  $("new-text").focus();
});
$("new-text").addEventListener("input", () => { $("add").disabled = !$("new-text").value.trim(); });

$("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = $("new-text").value.trim();
  if (!text) return;
  const body = { text, high: state.high };
  $("new-text").value = "";
  $("add").disabled = true;
  state.high = false;
  $("new-high").setAttribute("aria-pressed", "false");
  act(() => api("POST", "/api/tasks", body));
  $("new-text").focus();
});

$("clear-done").addEventListener("click", async (event) => {
  event.preventDefault();  // Don't toggle the <details>
  const done = state.tasks.filter((t) => t.done);
  if (!done.length) return;
  const plural = done.length === 1 ? "" : "s";
  if (!await confirmDialog(`Delete ${done.length} done task${plural}?`, "They will be removed (you can still undo it right after).", "Delete all", true)) return;
  let before = null;
  act(async () => {
    before = await api("GET", "/api/export");  // For the undo
    for (const task of done) await api("DELETE", `/api/tasks/${task.id}`);
  }).then(() => {
    if (before) toast(`Cleared ${done.length} done task${done.length === 1 ? "" : "s"}`,
                      () => api("POST", "/api/import", { mode: "replace", data: before }));
  });
});

// ---------- export / import ----------
$("export").addEventListener("click", async () => {
  try {
    const data = await api("GET", "/api/export");
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const link = el("a", { href: URL.createObjectURL(blob), download: `tasks-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    toast(`Exported ${data.tasks.length} task${data.tasks.length === 1 ? "" : "s"}`);
  } catch (error) {
    toast(error.message);
  }
});

$("import").addEventListener("click", () => $("import-file").click());
$("import-file").addEventListener("change", async () => {
  const file = $("import-file").files[0];
  $("import-file").value = "";  // The same file can be picked again
  if (!file) return;
  let data;
  try {
    data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.tasks)) throw new Error();
  } catch {
    toast(`${file.name} is not a task export`);
    return;
  }
  const pending = data.tasks.filter((t) => t && !t.done).length;
  $("import-summary").textContent = `${file.name}: ${data.tasks.length} task${data.tasks.length === 1 ? "" : "s"} ` +
    `(${pending} pending, ${data.tasks.length - pending} done). You have ${state.tasks.length} now.`;
  const dialog = $("import-dialog");
  dialog.returnValue = "cancel";
  dialog.addEventListener("close", () => {
    const mode = dialog.returnValue;
    if (mode !== "merge" && mode !== "replace") return;
    let before = null, result = null;
    act(async () => {
      before = await api("GET", "/api/export");  // For the undo
      result = await api("POST", "/api/import", { mode, data });
    }).then(() => {
      if (!result) return;
      const what = mode === "replace" ? `Replaced with ${result.added} task${result.added === 1 ? "" : "s"}`
                                      : `Imported ${result.added}${result.skipped ? `, ${result.skipped} already there` : ""}`;
      toast(what, () => api("POST", "/api/import", { mode: "replace", data: before }));
    });
  }, { once: true });
  dialog.showModal();
});

// ---------- start ----------
load().catch((error) => { $("sync").className = "sync error"; $("sync-text").textContent = error.message; });
// Reload the tasks (other devices may have changed them) and keep the countdown fresh, unless something is being typed
setInterval(() => {
  const dialogOpen = $("detail").open || $("confirm").open || $("import-dialog").open;
  if (!dialogOpen && !$("new-text").value) load().catch(() => {});
  else renderSync();
}, REFRESH_MS);
setInterval(renderSync, 30000);
</script>
</body>
</html>
