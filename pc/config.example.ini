; Copy to config.ini (git-ignored) and edit.
[esp32]
; Must match POWER_SAVING in the board's config.h. true: the board only has WiFi on in
; short windows (the settings below explain them). false: the board keeps WiFi on 24/7;
; the calendar and tasks are checked every minute, at any hour, and pushed only when they
; changed. Run install_tasks.ps1 again after changing it.
power_saving = true
; Only with power_saving = false and a board firmware older than GET /status (newer ones
; report what they hold, so a board that restarted is refilled by itself): also push
; unchanged data when the last push is this many minutes old. 0 = push only on changes.
resend_every_min = 0
; mDNS name of the board (MDNS_HOSTNAME in config.h) or its IP address. The board
; only has WiFi on for ~2 min every 15, and mDNS can be slow to answer right after
; it connects: a fixed IP (DHCP reservation in the router) is more reliable.
host = rlcd-dashboard.local
port = 80
; Calendar (calendar_bridge): must match CALENDAR_TOKEN in secrets.h. It turns the
; calendar screen on: without a token the board ignores the calendar.
token = change-me
; The board's WiFi window (:59-:01, :14-:16, ...) is short: retry every few seconds
; until it answers. timeout_s is per attempt.
retry_every_s = 5
timeout_s = 4
; Only used when running resident (without --once; the scheduled task uses --once):
; start reading Outlook this many seconds before each window opens
read_lead_s = 40

[tasks]
; Task list page (tasks_server): token must match TASKS_TOKEN in secrets.h. It turns
; the tasks screen on: without a token the board ignores tasks. Leave this section
; out if you don't use the tasks.
token = change-me-too
; Where the page listens. 0.0.0.0 makes it reachable from other devices (phone);
; use 127.0.0.1 for this PC only. Windows asks to allow it in the firewall the first time.
bind = 0.0.0.0
port = 8765
; Optional password for the page (asked once per browser). Empty = anyone on the network can edit.
web_token =
; The page answers to IP addresses, localhost and this PC's name. Other names you open it
; with (comma separated), e.g. a DNS name of this PC.
allowed_hosts =

[outlook]
; new = new Outlook for Windows (its offline cache), classic = classic Outlook (COM)
source = new
; Only this account's meetings, if the new Outlook has several (e.g. work + personal).
; Leave empty to use all of them.
mailbox =
; New Outlook data folder; empty = %LOCALAPPDATA%\Microsoft\Olk\EBWebView\Default\IndexedDB
indexeddb_dir =
